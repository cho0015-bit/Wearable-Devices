<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wearable Devices</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#101522}
.wrap{max-width:1100px;margin:28px auto;padding:0 18px}
.poster{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(20,45,80,.15)}
.poster img{display:block;width:100%;height:auto}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:22px;background:#fff;border-top:1px solid #e7edf5}
.btn{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:17px;padding:14px 18px;font-weight:750;font-size:16px;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,70,140,.14)}
.survey{color:#12833b;background:#effbf3;border:1px solid #9de0b4}
.view{color:#1268df;background:#eff6ff;border:1px solid #9bc7ff}
.apple{color:#7134c7;background:#f7f0ff;border:1px solid #cdb1f5}
@media(max-width:720px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="poster">
    <img src="wearable_devices_poster.png" alt="Wearable Devices poster">
    <div class="actions">
      <a class="btn survey" href="https://www.surveymonkey.com/r/Z69XBX8" target="_blank" rel="noopener">📋 Take the Survey</a>
      <a class="btn view" href="wearable_devices_poster.png" target="_blank" rel="noopener">🖼️ View Our Poster</a>
      <a class="btn apple" href="apple_watch_series_12_project_website.html" target="_blank" rel="noopener">⌚ Apple Watch Series 12</a>
    </div>
  </div>
</div>
</body>
</html>
